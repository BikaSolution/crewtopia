# Template for deploy/kratos/secrets.yml (git-ignored — never commit the real one).
#
#   cp deploy/kratos/secrets.example.yml deploy/kratos/secrets.yml
#   chmod 644 deploy/kratos/secrets.yml   # kratos runs as uid 10000 and must be able to read it
#
# Generate the values with:
#   cookie: openssl rand -hex 32   (64 hex chars)
#   cipher: openssl rand -hex 16   (exactly 32 chars — Kratos requires 32)
#
# Keep them fixed across restarts so existing sessions and CSRF cookies stay
# valid. To rotate, put the new value first and keep the old one below it
# until existing sessions have expired.
secrets:
  cookie:
    - CHANGE-ME-64-HEX-CHARS
  cipher:
    - CHANGE-ME-32-CHARS-EXACTLY-0000
