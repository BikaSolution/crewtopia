version: v1.3.0

dsn: sqlite:///var/lib/kratos/db.sqlite?_fk=true

# secrets.cookie / secrets.cipher are deliberately NOT in this file. They
# live in deploy/kratos/secrets.yml (git-ignored), which docker-compose.yml
# passes as a second -c so it's merged on top of this one. Copy
# secrets.example.yml to secrets.yml and fill it in for a new install.

serve:
  public:
    base_url: https://crewtopia.bikasolutions.co.za/.ory/kratos/public/
    cors:
      enabled: false
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: https://crewtopia.bikasolutions.co.za/staff
  allowed_return_urls:
    - https://crewtopia.bikasolutions.co.za/

  methods:
    password:
      enabled: true
    link:
      enabled: true
      config:
        lifespan: 24h
    code:
      enabled: false

  flows:
    login:
      ui_url: https://crewtopia.bikasolutions.co.za/login
      lifespan: 10m

    logout:
      after:
        default_browser_return_url: https://crewtopia.bikasolutions.co.za/login

    registration:
      enabled: false

    settings:
      ui_url: https://crewtopia.bikasolutions.co.za/settings
      privileged_session_max_age: 15m
      required_aal: highest_available

    recovery:
      enabled: true
      ui_url: https://crewtopia.bikasolutions.co.za/recovery
      use: link
      notify_unknown_recipients: false

    verification:
      enabled: false

log:
  level: debug
  format: text

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://test:test@localhost:1025/?skip_ssl_verify=true
