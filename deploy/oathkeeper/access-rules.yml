- id: app-public-roster-view
  # The read-only roster (bare /roster, no trailing path) is publicly
  # viewable — no session required. Everything under /roster/... (edit,
  # export, reassignment) is still gated by app-protected-roster below.
  match:
    url: "<**>/roster"
    methods: ["GET"]
  upstream:
    url: "http://app:8080"
  authenticators:
    - handler: noop
  authorizer:
    handler: allow
  mutators:
    - handler: noop

