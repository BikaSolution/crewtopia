- id: app-protected-staff
  match:
    url: "<**>/staff<**>"
    methods: ["GET", "POST", "PUT", "PATCH", "DELETE"]
  upstream:
    url: "http://app:8080"
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header
      config:
        headers:
          X-User-Id: "{{ print .Subject }}"
          X-User-Email: "{{ print .Extra.identity.traits.email }}"
          X-User-Role: "{{ print .Extra.identity.metadata_public.role }}"

