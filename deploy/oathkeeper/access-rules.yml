# Note: this glob implementation doesn't support {a,b,c} brace alternation
# (tried it, matches nothing) — so each path prefix gets its own rule instead
# of one combined pattern. Oathkeeper requires exactly one rule to match any
# given request, which is also why the public pages/assets are enumerated
# rather than handled by a catch-all that would overlap app-protected-*.

- id: kratos-public-api
  match:
    url: "<**>/.ory/kratos/public/<**>"
    methods: ["GET", "POST", "PUT", "PATCH", "DELETE"]
  upstream:
    url: "http://kratos:4433"
    strip_path: /.ory/kratos/public
  authenticators:
    - handler: noop
  authorizer:
    handler: allow
  mutators:
    - handler: noop

